services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: argos
      POSTGRES_USER: argos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U argos -d argos"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ../server
    environment:
      DATABASE_URL: postgres://argos:${POSTGRES_PASSWORD}@db:5432/argos
      OWNER_TOKEN: ${OWNER_TOKEN:?defina OWNER_TOKEN no .env}
      KEY_DIR: /app/data/keys
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - keys:/app/data/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres:
  keys:
