services:
  api:
    environment:
      COOKIE_SECURE: "true"
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      ARGOS_DOMAIN: ${ARGOS_DOMAIN:?defina um dominio com DNS apontando ao servidor}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
